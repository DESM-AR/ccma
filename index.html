<style>
:root{color-scheme:light;--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--go:#16a34a;--navy:#011b30;--navy2:#1b4560;--lime:#c8e64a;--steps-off:#b9d0dd;--bg:#f2f4f1;--ink:#14212b;--muted:#61717c;--line:#e4e8e6;--soft:#f5f7f5;--red:#c03b2b;--red-bg:#fbeae7;--green:#18703e;--green-bg:#e4f3e9;--amber-bg:#fdf2d8}

.invalid,.money.invalid{border-color:var(--red)!important;box-shadow:0 0 0 1px var(--red)}

.ok{background:var(--green-bg);color:#145a33;border-radius:14px;padding:14px;font-size:15px;margin-bottom:12px;text-align:center;font-weight:600}
.sec{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:16px 4px 8px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:20px 18px;margin-bottom:16px}
.hero h2{font-size:23px}
.hero p{color:#b9d0dd;margin:6px 0 16px}
.badge{font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--amber-bg);color:#7a530f;white-space:nowrap}
.badge.club{background:#e3ecf1;color:var(--navy2)}
.act{display:flex;gap:2px}
.act .ib{width:40px;height:40px;color:var(--muted)}
#ov,#dlg{position:fixed;inset:0;background:rgba(10,25,36,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
#ov.open,#dlg.open{display:flex}

.sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transition:transform 300ms var(--ease-drawer)}
@starting-style{.sheet{transform:translateY(100%)}}
#ov{transition:opacity 200ms ease}
@starting-style{#ov.open{opacity:0}}

.sh-h{display:flex;align-items:center;padding:4px 8px 6px 18px}
.sh-h h2{flex:1;font-size:19px}
.sh-b{padding:8px 18px 16px;overflow-y:auto}
.sh-f{display:flex;gap:10px;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,16px);transition:opacity 200ms ease,transform 260ms var(--ease-out)!important;background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-size:15px;z-index:70;opacity:0;pointer-events:none;transition:.2s;display:flex;gap:14px;align-items:center;max-width:92vw}

<body>
<div class="splash" id="splash" role="img" aria-label="CCMA, Cuentas Claras Mantienen la Amistad" data-a="skipSplash"><img class="splash-logo" src="logo.webp" alt="" width="1100" height="186"></div>
<div class="app"><header class="top" id="top"></header><main id="main" aria-live="off"></main></div>
<div class="foot" id="foot"></div><div id="fab"></div>
<div id="ov"></div><div id="dlg"></div><div id="toast" role="status" aria-live="polite"></div>

<script id="engine">
"use strict";
/* ===== Motor de cálculo: centavos enteros, las sumas cierran exacto ===== */
function parseMoney(v){
  if(typeof v==='number') return v;
  let s=String(v==null?'':v).trim().replace(/[$\s]/g,''); if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  if(!/^\d*\.?\d*$/.test(s)||s==='.') return NaN; return Number(s);
}
const toC=v=>{const n=typeof v==='number'?v:parseMoney(v);return Number.isFinite(n)?Math.round(n*100):0;};
function fmt(c){c=Math.round(c||0);const neg=c<0;c=Math.abs(c);const p=Math.floor(c/100),r=c%100;let s=String(p).replace(/\B(?=(\d{3})+(?!\d))/g,'.');if(r)s+=','+String(r).padStart(2,'0');return (neg?'−$':'$')+s;}
function allocate(total,n){const b=Math.floor(total/n),r=total-b*n;return Array.from({length:n},(_,i)=>b+(i<r?1:0));}
/* saldo = lo que le corresponde (su parte de cada categoría en la que entra) − lo que pagó */
const gC=g=>Math.round(toC(g.monto)*(100+(Number(g.prop)||0))/100);
function liquidate(e,cats){
  const rows={};e.people.forEach(p=>rows[p.id]={id:p.id,consumo:0,pago:0,saldo:0,byCat:{}});
  const cs=e.cats.map(id=>{const c=cats.find(x=>x.id===id)||{id,nombre:'(categoría borrada)',color:'#999'};const total=e.gastos.filter(g=>g.cat===id).reduce((a,g)=>a+gC(g),0);const ids=e.people.filter(p=>p.cats.includes(id)).map(p=>p.id);return {id,nombre:c.nombre,color:c.color,total,ids};});
  const warns=[];
  cs.forEach(c=>{if(!c.total)return;if(!c.ids.length){warns.push('Nadie entra en “'+c.nombre+'”: '+fmt(c.total)+' sin repartir.');return;}const a=allocate(c.total,c.ids.length);c.ids.forEach((id,i)=>{rows[id].consumo+=a[i];rows[id].byCat[c.id]=a[i];});});
  e.gastos.forEach(g=>{if(rows[g.pagador])rows[g.pagador].pago+=gC(g);else warns.push('“'+g.concepto+'” lo pagó alguien que ya no está en el evento.');});
  const list=e.people.map(p=>rows[p.id]);list.forEach(r=>r.saldo=r.consumo-r.pago);
  return {rows:list,byId:rows,cats:cs,warns,total:e.gastos.reduce((a,g)=>a+gC(g),0),sum:list.reduce((a,r)=>a+r.saldo,0)};
}
function settle(L,hub){
  /* concentrador: todos le pagan a una persona y ella reparte */
  if(hub&&L.byId[hub]){const out=[];
    L.rows.filter(r=>r.id!==hub&&r.saldo>0).sort((a,b)=>b.saldo-a.saldo).forEach(r=>out.push({de:r.id,para:hub,c:r.saldo}));
    L.rows.filter(r=>r.id!==hub&&r.saldo<0).sort((a,b)=>a.saldo-b.saldo).forEach(r=>out.push({de:hub,para:r.id,c:-r.saldo}));
    return out;}
  const d=L.rows.filter(r=>r.saldo>0).map(r=>({id:r.id,a:r.saldo})).sort((x,y)=>y.a-x.a);
  const c=L.rows.filter(r=>r.saldo<0).map(r=>({id:r.id,a:-r.saldo})).sort((x,y)=>y.a-x.a);
  const out=[];let i=0,j=0;
  while(i<d.length&&j<c.length){const m=Math.min(d[i].a,c[j].a);out.push({de:d[i].id,para:c[j].id,c:m});d[i].a-=m;c[j].a-=m;if(!d[i].a)i++;if(!c[j].a)j++;}
  return out;
}
const COLORS=['#1f6f8b','#b5462f','#9e5f00','#6b4fa0','#26784e','#b0346b','#2f6fa6','#5d6a73'];
/* colores anteriores con poco contraste para texto blanco → equivalentes accesibles */
const COLOR_FIX={'#d98e04':'#9e5f00','#2f8a5b':'#26784e','#c2417a':'#b0346b','#3b7fb8':'#2f6fa6','#6f7d87':'#5d6a73'};
function seedDB(){

  const NOMBRES=['Andrés','Cabeza','Dani','Darío','Gabi','Gera','Julio','Martín','Mauri','Nico','Pablo','Santi'];
  const people=[{id:'club',nombre:'Club',club:true,pausado:false,alias:''}].concat(NOMBRES.map((n,i)=>({id:'p'+(i+1),nombre:n,alias:'',pausado:false})));
  const cats=[{id:'c1',nombre:'Pádel',color:COLORS[0],pausado:false,prop:0},{id:'c2',nombre:'Comida',color:COLORS[1],pausado:false,prop:10}];
  return {v:4,people,cats,events:[],active:null};
}
if(typeof module!=='undefined') module.exports={parseMoney,toC,gC,fmt,liquidate,settle,seedDB};

<script>
"use strict";
const KEY='padelday.v4';
let DB,SCREEN='home',BACK='home',SH=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const toInput=c=>(c/100).toFixed(2).replace(/\.00$/,'').replace('.',',');
const I={padel:'<circle cx="12" cy="12" r="8.5"/><path d="M6 6c3.2 3.4 3.2 8.6 0 12M18 6c-3.2 3.4-3.2 8.6 0 12"/>',food:'<path d="M7 3v6.5a2 2 0 0 0 4 0V3M9 11.5V21M17 21V3c-2 1.4-3 3.8-3 7v3.5h3"/>',drink:'<path d="M6 3h12l-1.6 17.5H7.6zM6.5 8.5h11"/>',star:'<path d="M12 3.3l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17.1l-5.38 2.85 1.03-6L3.3 9.7l6-.9z"/>',back:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12.5 10 17 19 7"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',chat:'<path d="M4 20l1.5-4A8 8 0 1 1 9 19.5z"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',pause:'<path d="M9 5v14M15 5v14"/>',play:'<path d="M7 5l12 7-12 7z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/>',tag:'<path d="M3 12V4h8l10 10-8 8z"/><path d="M7.5 8.5h.01" stroke-width="3"/>',home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',save:'<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>'};
const ic=(k,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;

function load(){try{const s=localStorage.getItem(KEY)||migrateV3();if(s){DB=JSON.parse(s);if(Array.isArray(DB.events)&&Array.isArray(DB.people)){(DB.cats||[]).forEach(c=>{if(COLOR_FIX[c.color])c.color=COLOR_FIX[c.color];if(c.prop==null){if(/^asado$/i.test(c.nombre)){c.nombre='Comida';c.prop=10;}else c.prop=0;}});return;}}}catch(e){}DB=seedDB();save();}
/* Si el teléfono tenía datos reales de la versión anterior se conservan; si solo tenía el ejemplo, arranca con la lista nueva */
function migrateV3(){try{const s=localStorage.getItem('padelday.v3');if(!s)return null;const d=JSON.parse(s);
  const soloEjemplo=(d.events||[]).every(e=>e.id==='ev1')&&(d.people||[]).every(p=>p.club||/^p[1-8]$/.test(p.id));
  return soloEjemplo?null:s;}catch(e){return null;}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function save(){saveLocal();if(SYNC.url)queuePush();}

/* ===== Datos compartidos (Firebase Realtime Database, vía REST: sin librerías) =====
   Todos los que abren el link con la misma base ven y editan los mismos datos, en vivo.
   El evento abierto (DB.active) es de cada teléfono y no se comparte. */
const DEFAULT_DB='';            /* si se completa, el link de la app ya trae la base compartida */
const DBKEY='ccma.shared.db';
const SYNC={url:null,status:'off',last:null,es:null,pending:false,timer:null,retry:null,pullT:null};
const GAS=typeof google!=='undefined'&&google.script&&google.script.run;
function gas(fn,arg){return new Promise((res,rej)=>{const r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);arg===undefined?r[fn]():r[fn](arg);});}
function dbUrlOk(u){if(u==='gas')return !!GAS;return /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/i.test(u)||/^http:\/\/localhost:\d+$/.test(u);}
const cleanUrl=u=>String(u||'').trim().replace(/\/+$/,'').replace(/\/[^/]*\.json$/,'');
const asArr=v=>Array.isArray(v)?v.filter(x=>x!=null):(v&&typeof v==='object'?Object.values(v):[]);
function toRemote(D){
  const m=(arr,ord)=>Object.fromEntries(arr.map((x,i)=>[x.id,Object.assign({},x,{orden:ord?ord(x,i):i})]));
  return {people:m(D.people),cats:m(D.cats),events:m(D.events,(e,i)=>e.orden!=null?e.orden:i)};
}
function fromRemote(R){
  const s=o=>asArr(o).sort((a,b)=>(a.orden||0)-(b.orden||0));
  const people=s(R.people).map(p=>({id:p.id,nombre:p.nombre||'',alias:p.alias||'',pausado:!!p.pausado,club:!!p.club,orden:p.orden}));
  const cats=s(R.cats).map(c=>({id:c.id,nombre:c.nombre||'',color:c.color||COLORS[0],pausado:!!c.pausado,prop:Number(c.prop)||0,orden:c.orden}));
  const events=s(R.events).map(e=>({id:e.id,titulo:e.titulo||'',orden:e.orden,hub:e.hub||'',cats:asArr(e.cats),people:asArr(e.people).map(p=>({id:p.id,cats:asArr(p.cats)})),gastos:asArr(e.gastos).map(g=>({id:g.id,concepto:g.concepto||'',monto:Number(g.monto)||0,pagador:g.pagador||'',cat:g.cat||'',prop:Number(g.prop)||0}))}));
  if(!people.some(p=>p.club)) people.unshift({id:'club',nombre:'Club',club:true,pausado:false,alias:''});
  return {v:3,people,cats,events,active:null};
}
function flat(R){const o={};['people','cats','events'].forEach(k=>{for(const id in (R[k]||{}))o[k+'/'+id]=JSON.stringify(R[k][id]);});return o;}
function setStatus(s){SYNC.status=s;const el=$('#sync');if(el)el.outerHTML=syncBadge();}
function syncBadge(){if(!SYNC.url)return '<span id="sync"></span>';const t={live:'En vivo',offline:'Sin conexión',connecting:'Conectando…'}[SYNC.status]||'';return `<span id="sync" class="sync ${SYNC.status}" role="status" title="Datos compartidos: ${t}"><i></i><span class="t">${t}</span></span>`;}
function queuePush(){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(push,350);}
async function push(){
  if(!SYNC.url)return;
  const f=flat(toRemote(DB)),last=SYNC.last||{},body={};
  for(const k in f)if(f[k]!==last[k])body[k]=JSON.parse(f[k]);
  for(const k in last)if(!(k in f))body[k]=null;
  if(!Object.keys(body).length){SYNC.pending=false;return;}
  try{if(SYNC.url==='gas'){SYNC.ver=await gas('ccmaPatch',JSON.stringify(body));}else{const r=await fetch(SYNC.url+'/ccma.json',{method:'PATCH',body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);}SYNC.last=f;SYNC.pending=false;setStatus('live');}
  catch(e){SYNC.pending=true;setStatus('offline');clearTimeout(SYNC.retry);SYNC.retry=setTimeout(push,8000);}
}
async function pull(){
  if(!SYNC.url)return;
  if(SYNC.pending){await push();if(SYNC.pending)return;}
  try{
    let R;
    if(SYNC.url==='gas'){const g=await gas('ccmaGet');R=g.data;SYNC.ver=g.v;if(g.url)SYNC.link=g.url;}
    else{const r=await fetch(SYNC.url+'/ccma.json');if(!r.ok)throw new Error(r.status);R=await r.json();}
    if(R==null||!R.people){/* base vacía: se sube lo que hay en este teléfono */const all=toRemote(DB);
      if(SYNC.url==='gas'){SYNC.ver=await gas('ccmaPut',JSON.stringify(all));}else{const w=await fetch(SYNC.url+'/ccma.json',{method:'PUT',body:JSON.stringify(all)});if(!w.ok)throw new Error(w.status);}
      SYNC.last=flat(all);setStatus('live');return;}
    const active=DB.active;DB=fromRemote(R);DB.active=DB.events.some(e=>e.id===active)?active:null;saveLocal();SYNC.last=flat(toRemote(DB));setStatus('live');
    if(!DB.active&&STEPS.some(s=>s[0]===SCREEN)&&SCREEN!=='evento')SCREEN='home';
    render();
  }catch(e){setStatus('offline');}
}
function startLive(){
  if(SYNC.es)SYNC.es.close();
  if(SYNC.url==='gas'){clearInterval(SYNC.poll);SYNC.poll=setInterval(async()=>{if(document.hidden)return;try{const v=await gas('ccmaVersion');if(SYNC.status!=='live')setStatus('live');if(v!==SYNC.ver)pull();}catch(e){setStatus('offline');}},4000);return;}
  if(!SYNC.url||typeof EventSource==='undefined')return;
  const es=new EventSource(SYNC.url+'/ccma.json');SYNC.es=es;
  const kick=()=>{clearTimeout(SYNC.pullT);SYNC.pullT=setTimeout(pull,250);};
  es.addEventListener('put',kick);es.addEventListener('patch',kick);
  es.onopen=()=>{if(SYNC.status!=='live')kick();};
  es.onerror=()=>setStatus('offline');
}
async function connectShared(url,{silent}={}){
  url=url==='gas'?'gas':cleanUrl(url);if(!dbUrlOk(url))return false;
  SYNC.url=url;if(url!=='gas'){try{localStorage.setItem(DBKEY,url);}catch(e){}}
  setStatus('connecting');await pull();startLive();
  if(!silent)toast(SYNC.status==='live'?'Conectado: los cambios se ven en todos los teléfonos':'Se guardó la base; se sincroniza cuando haya conexión');
  return true;
}
function disconnectShared(){clearInterval(SYNC.poll);if(SYNC.es)SYNC.es.close();SYNC.es=null;SYNC.url=null;SYNC.last=null;SYNC.status='off';try{localStorage.removeItem(DBKEY);}catch(e){}}
function groupLink(){return SYNC.url==='gas'?(SYNC.link||''):location.origin+location.pathname+'?db='+encodeURIComponent(SYNC.url);}
window.addEventListener('online',()=>{if(SYNC.url){push();pull();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SYNC.url)pull();});
const ev=()=>DB.events.find(e=>e.id===DB.active);
const person=id=>DB.people.find(p=>p.id===id);
const pname=id=>{const p=person(id);return p?p.nombre:'(borrado)';};
const catM=id=>DB.cats.find(c=>c.id===id);
const L_=e=>liquidate(e,DB.cats);
const catIcon=c=>/p[aá]del|tenis|cancha/i.test(c.nombre)?'padel':/comida|asado|cena|almuerzo|morfi|pizza|parrilla/i.test(c.nombre)?'food':/bebida|birra|cerveza|vino|fernet|tragos?/i.test(c.nombre)?'drink':'';
const catGlyph=(c,s=19)=>{const k=catIcon(c);return k?ic(k,s):`<span class="lt">${esc((c.nombre||'?').trim().charAt(0).toUpperCase())}</span>`;};
const ini=n=>esc((n||'?').trim().charAt(0).toUpperCase());
/* orden: Club primero, luego alfabético */
const evPeople=e=>e.people.slice().sort((a,b)=>(person(b.id)?.club?1:0)-(person(a.id)?.club?1:0)||pname(a.id).localeCompare(pname(b.id),'es'));
const evCats=e=>e.cats.map(catM).filter(Boolean);
function commit(fn,msg,undo){const prev=JSON.stringify(DB);fn();save();render();if(msg)toast(msg,undo?()=>{DB=JSON.parse(prev);save();render();}:null);}

function sheet(title,body,foot){LASTFOCUS=document.activeElement;$('#ov').innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh-h"><h2>${esc(title)}</h2><button class="ib" data-a="close" aria-label="Cerrar">${ic('x')}</button></div><div class="sh-b" id="shb">${body}</div>${foot?`<div class="sh-f">${foot}</div>`:''}</div>`;$('#ov').classList.add('open');document.body.classList.add('noscroll');}
function close(){$('#ov').classList.remove('open');$('#ov').innerHTML='';document.body.classList.remove('noscroll');SH=null;if(LASTFOCUS&&document.contains(LASTFOCUS))LASTFOCUS.focus();}
let LASTFOCUS=null;
function ask(msg,ok,danger,title,cancel){return new Promise(r=>{const prev=document.activeElement;const d=$('#dlg');d.innerHTML=`<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgT" aria-describedby="dlgM"><h3 id="dlgT">${esc(title||'¿Confirmás?')}</h3><p id="dlgM">${msg}</p><div class="b"><button class="btn" id="no">${esc(cancel||'Cancelar')}</button><button class="btn ${danger?'red':'pri'}" id="si">${esc(ok)}</button></div></div>`;d.classList.add('open');const done=v=>{d.classList.remove('open');d.innerHTML='';prev&&prev.focus&&prev.focus();r(v);};$('#no').onclick=()=>done(false);$('#si').onclick=()=>done(true);d.onkeydown=x=>{if(x.key==='Escape'){x.stopPropagation();done(false);}};$('#no').focus();});}
function info(msg){const d=$('#dlg');d.innerHTML=`<div class="dlg"><p style="margin-top:0">${msg}</p><div class="b"><button class="btn pri" id="si">Entendido</button></div></div>`;d.classList.add('open');$('#si').onclick=()=>{d.classList.remove('open');d.innerHTML='';};}
let TT;function toast(m,undo){const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>${undo?'<button id="tu">Deshacer</button>':''}`;t.classList.add('show');if(undo)$('#tu').onclick=()=>{t.classList.remove('show');undo();};clearTimeout(TT);TT=setTimeout(()=>t.classList.remove('show'),undo?6000:2200);}

/* ---------- navegación ---------- */
const STEPS=[['evento','Evento'],['gastos','Gastos'],['personas','Participantes'],['liquidacion','Liquidación']];
const MASTER={mpersonas:'Participantes',mcats:'Categorías'};
function go(s){if(MASTER[s]&&!MASTER[SCREEN])BACK=SCREEN;SCREEN=s;try{history.replaceState(null,'',s==='home'?location.pathname:'#'+s);}catch(e){}render();window.scrollTo(0,0);}
function render(){
  const e=ev();if(STEPS.some(x=>x[0]===SCREEN)&&!e&&SCREEN!=='evento')SCREEN='home';
  const idx=STEPS.findIndex(s=>s[0]===SCREEN);
  const menuBtn=syncBadge()+`<button class="ib" data-a="menu" aria-label="Menú">${ic('menu')}</button>`;
  if(SCREEN==='home') $('#top').innerHTML=`<div class="bar"><h1 style="display:flex;align-items:center;padding-left:6px"><img src="logo.webp" alt="CCMA · Cuentas Claras Mantienen la Amistad" width="720" height="122" style="height:40px;width:auto;max-width:100%;object-fit:contain"></h1>${menuBtn}</div>`;
  else if(MASTER[SCREEN]) $('#top').innerHTML=`<div class="bar"><button class="ib" data-a="back" aria-label="Volver">${ic('back')}</button><h1>${MASTER[SCREEN]}</h1>${menuBtn}</div>`;
  else $('#top').innerHTML=`<div class="bar"><button class="ib" data-a="home" aria-label="Eventos">${ic('back')}</button><h1>${esc(e?e.titulo:'Nuevo evento')}</h1>${menuBtn}</div><div class="steps">${STEPS.map(([k,t],i)=>`<button class="${i===idx?'on':i<idx?'done':''}" data-a="step" data-v="${k}" ${!e?'disabled':''} ${i===idx?'aria-current="step"':''}><b>${i<idx?ic('check',13):i+1}</b>${t}</button>`).join('')}</div>`;
  $('#main').innerHTML=V[SCREEN]();
  const f=FOOT[SCREEN]();$('#foot').innerHTML=f?`<div class="in">${f}</div>`:'';$('#foot').style.display=f?'':'none';
  const fab={home:['nuevo','Nuevo evento'],mpersonas:['mNewPersonOpen','Nuevo participante'],mcats:['mNewCatOpen','Nueva categoría']}[SCREEN];
  $('#fab').innerHTML=fab?`<button class="fab ${f?'':'low'}" data-a="${fab[0]}" aria-label="${fab[1]}">${ic('plus',30)}</button>`:'';
}

/* ---------- pantallas ---------- */
const V={
home(){
  const list=DB.events.slice().reverse();
  return list.length?`<div class="sec" style="margin-top:4px">Mis eventos</div><div class="list">${list.map(e=>`<div class="row" style="padding:0 4px 0 0"><button class="row" style="border:0;flex:1" data-a="open" data-id="${e.id}"><div class="m"><b>${esc(e.titulo)}</b><small>${e.people.length} participantes · ${e.gastos.length} ${e.gastos.length===1?'gasto':'gastos'}</small></div><span class="amt num">${fmt(L_(e).total)}</span></button><button class="ib" style="color:var(--muted)" data-a="delEventId" data-id="${e.id}" aria-label="Eliminar evento">${ic('trash',20)}</button></div>`).join('')}</div>`
  :`<div class="empty" style="padding-top:60px"><b>Todavía no hay eventos</b>Tocá el botón + para crear el primero.</div>`;
},
evento(){
  const e=ev(), act=DB.people.filter(p=>!p.pausado).length, ac=DB.cats.filter(c=>!c.pausado).length;
  return `<div class="field"><label class="lbl" for="ft">Título del evento</label><input id="ft" value="${esc(e?e.titulo:'')}" placeholder="Ej.: 13° Pádel Day" autocomplete="off" enterkeyhint="next"></div>
  ${e?`<button class="btn red block" data-a="delEvent">${ic('trash',20)} Eliminar evento</button>`:`<p class="hint">Se crea con los ${act} participantes y las ${ac} categorías activas. Los que estén en pausa no se incluyen.</p>`}`;
},
gastos(){
  const e=ev(), L=L_(e);
  return `<div class="tot"><span>${e.gastos.length} gasto${e.gastos.length===1?'':'s'}</span><b class="num">${fmt(L.total)}</b></div>
  <button class="btn lime block" data-a="gasto" style="margin-bottom:12px">${ic('plus')} Agregar gasto</button>
  ${e.gastos.length?`<div class="list">${e.gastos.slice().reverse().map(g=>{const c=catM(g.cat);return `<button class="row" data-a="gasto" data-id="${g.id}"><div class="m"><b>${esc(g.concepto)}</b><small>Pagó ${esc(pname(g.pagador))} · <span class="dot" style="--c:${c?c.color:'#bbb'}"></span>${esc(c?c.nombre:'Sin categoría')}${g.prop?` · +${g.prop}% propina`:''}</small></div><span class="amt num">${fmt(gC(g))}</span></button>`;}).join('')}</div>`
  :`<div class="empty"><b>Todavía no hay gastos</b>Concepto, monto, quién pagó y categoría.</div>`}`;
},
personas(){
  const e=ev(), L=L_(e), cs=L.cats, ps=evPeople(e), hub=e.hub&&L.byId[e.hub]?e.hub:'';
  const ct=(c,on,attrs,who)=>`<button class="ct ${on?'on':''}" style="--c:${c.color}" ${attrs} aria-pressed="${on}" aria-label="${esc(c.nombre)}${who?': '+esc(who):''}" title="${esc(c.nombre)}">${catGlyph(c)}</button>`;
  const noClub=ps.filter(p=>!person(p.id)?.club);
  return `<div class="cs2">${cs.map(c=>`<div class="c ${c.total&&!c.ids.length?'bad':''}"><span class="g" style="--c:${c.color}">${catGlyph(c,17)}</span><div><b>${esc(c.nombre)}</b><small class="num">${c.total?(c.ids.length?fmt(Math.round(c.total/c.ids.length))+' c/u':'Nadie marcado'):'Sin gastos'}<br>${c.ids.length+(c.ids.length===1?' persona':' personas')}</small></div></div>`).join('')}</div>
  <div class="list">
    <div class="pb all"><span class="av">${ic('users',18)}</span><span class="n">Todos</span>${cs.map(c=>ct(c,c.ids.length===noClub.length&&c.ids.length>0,`data-a="allCat" data-id="${c.id}"`,'marcar a todos')).join('')}<span class="star off" aria-hidden="true"></span></div>
    ${ps.map(p=>{const r=L.byId[p.id],club=person(p.id)?.club,nm=pname(p.id),on=hub===p.id;return `<div class="pb ${club?'club':''}"><span class="av" aria-hidden="true">${ini(nm)}</span><button class="n" data-a="evPerson" data-id="${p.id}"><span>${esc(nm)}</span>${r.pago?`<small class="num">pagó ${fmt(r.pago)}</small>`:''}</button>${club?`<span class="solo">Solo cobra</span><span class="star off" aria-hidden="true"></span>`:cs.map(c=>ct(c,p.cats.includes(c.id),`data-a="tog" data-p="${p.id}" data-c="${c.id}"`,nm)).join('')+`<button class="star ${on?'on':''}" data-a="hub" data-id="${p.id}" aria-pressed="${on}" aria-label="Concentrar los pagos en ${esc(nm)}">${ic('star',23)}</button>`}</div>`;}).join('')}
  </div>
  <div class="hubn">${hub?`${ic('star',17)}<span><b>${esc(pname(hub))}</b> recibe todas las transferencias y después le paga a quien corresponda.</span>`:`<span>Tocá la estrella de alguien para que todos le transfieran a esa persona y ella reparta.</span>`}</div>
  <button class="btn block sm" data-a="sumar">${ic('plus',18)} Sumar a alguien que no está</button>`;
},
liquidacion(){
  const e=ev(), L=L_(e), tr=settle(L,e.hub);
  return `${L.warns.map(w=>`<div class="err">${esc(w)}</div>`).join('')}
  <div class="tot"><span>Total del evento</span><b class="num">${fmt(L.total)}</b></div>
  <div class="sec">Quién le paga a quién</div>
  ${e.hub&&L.byId[e.hub]&&tr.length?`<div class="hubn">${ic('star',17)}<span>Todos le transfieren a <b>${esc(pname(e.hub))}</b> y después reparte.</span></div>`:''}
  ${tr.length?`<div class="list">${tr.map((t,i)=>{const al=person(t.para)?.alias;return `<div class="tr${i&&tr[i-1].de===t.de?' same':''}"><div style="flex:1;min-width:0"><div class="w"><b>${esc(pname(t.de))}</b>${ic('arrow',16)}<b>${esc(pname(t.para))}</b></div>${al?`<button class="alias" data-a="copyAlias" data-v="${esc(al)}">${ic('copy',15)} ${esc(al)}</button>`:`<button class="alias none" data-a="mEditPerson" data-id="${t.para}">${ic('plus',15)} Agregar alias</button>`}</div><span class="amt num">${fmt(t.c)}</span></div>`;}).join('')}</div>`:`<div class="ok">${L.total?'Nadie le debe nada a nadie ✅':'Todavía no hay gastos.'}</div>`}
  <div class="sec">Cuenta de cada uno</div>
  <div class="list">${L.rows.filter(r=>r.consumo||r.pago).sort((a,b)=>b.saldo-a.saldo).map(r=>`<button class="row" data-a="detail" data-id="${r.id}"><div class="m"><b>${esc(pname(r.id))}</b><small class="num">Le toca ${fmt(r.consumo)} · pagó ${fmt(r.pago)}</small></div>${r.saldo>0?`<span class="sal d num">Paga ${fmt(r.saldo)}</span>`:r.saldo<0?`<span class="sal r num">Recibe ${fmt(-r.saldo)}</span>`:'<span class="sal z">Saldado</span>'}</button>`).join('')||'<div class="empty">Sin movimientos.</div>'}</div>`;
},
mpersonas(){
  const ps=DB.people.slice().sort((a,b)=>(b.club?1:0)-(a.club?1:0)||(a.pausado-b.pausado)||a.nombre.localeCompare(b.nombre,'es'));
  return `<div class="list">${ps.map(p=>`<div class="row ${p.pausado?'dim':''}" style="min-height:54px;padding:6px 6px 6px 14px"><div class="m"><b>${esc(p.nombre)}</b>${p.alias?`<small>Alias: ${esc(p.alias)}</small>`:`<small style="color:#6b7880">Sin alias</small>`}</div>${p.club?'<span class="badge club">Fijo</span>':p.pausado?'<span class="badge">En pausa</span>':''}<div class="act"><button class="ib" data-a="mEditPerson" data-id="${p.id}" aria-label="Editar">${ic('edit',19)}</button>${p.club?'':`<button class="ib" data-a="mPausePerson" data-id="${p.id}" aria-label="${p.pausado?'Reactivar':'Pausar'}">${ic(p.pausado?'play':'pause',19)}</button><button class="ib" data-a="mDelPerson" data-id="${p.id}" aria-label="Eliminar">${ic('trash',19)}</button>`}</div></div>`).join('')}</div>`;
},
mcats(){
  return `<div class="list">${DB.cats.map(c=>`<div class="row ${c.pausado?'dim':''}" style="min-height:54px;padding:6px 6px 6px 14px"><span class="dot" style="--c:${c.color};width:12px;height:12px"></span><div class="m"><b>${esc(c.nombre)}</b>${c.prop?`<small>Propina ${c.prop}%</small>`:''}</div>${c.pausado?'<span class="badge">En pausa</span>':''}<div class="act"><button class="ib" data-a="mEditCat" data-id="${c.id}" aria-label="Editar">${ic('edit',19)}</button><button class="ib" data-a="mPauseCat" data-id="${c.id}" aria-label="${c.pausado?'Reactivar':'Pausar'}">${ic(c.pausado?'play':'pause',19)}</button><button class="ib" data-a="mDelCat" data-id="${c.id}" aria-label="Eliminar">${ic('trash',19)}</button></div></div>`).join('')||'<div class="empty">Sin categorías.</div>'}</div>`;
}
};
const FOOT={
  home:()=>'',
  evento:()=>`<button class="btn pri grow" data-a="saveEvent">${ev()?'Guardar y seguir':'Crear evento'} ${ic('arrow',18)}</button>`,
  gastos:()=>`<button class="btn pri grow" data-a="step" data-v="personas">Siguiente: participantes ${ic('arrow',18)}</button>`,
  personas:()=>`<button class="btn lime grow" data-a="step" data-v="liquidacion">Liquidación ${ic('arrow',18)}</button>`,
  liquidacion:()=>`<button class="btn lime grow" data-a="share">${ic('chat',20)} Compartir por WhatsApp</button>`,
  mpersonas:()=>`<button class="btn pri grow" data-a="back">Listo</button>`,
  mcats:()=>`<button class="btn pri grow" data-a="back">Listo</button>`
};

/* ---------- gasto ---------- */
function openGasto(id){
  const e=ev(), g=id?e.gastos.find(x=>x.id===id):null;
  SH={id,concepto:g?g.concepto:'',monto:g?toInput(toC(g.monto)):'',pagador:g?g.pagador:'',cat:g?g.cat:(SH_LASTCAT||'')};SH.tip=!!(g&&g.prop>0);SH.gprop=g?(Number(g.prop)||0):0;SH.gcat0=g?g.cat:"";
  sheet(id?'Editar gasto':'Agregar gasto',gastoBody(),`${id?`<button class="btn red" data-a="delGasto" aria-label="Eliminar">${ic('trash')}</button>`:`<button class="btn grow" data-a="saveGasto" data-v="otro">Guardar y otro</button>`}<button class="btn pri grow" data-a="saveGasto">Guardar</button>`);
  if(!id)setTimeout(()=>$('#gc')&&$('#gc').focus(),80);
}
let SH_LASTCAT='';
function gastoBody(){
  const e=ev();
  return `<div class="field"><label class="lbl" for="gc">Concepto</label><input id="gc" value="${esc(SH.concepto)}" placeholder="Ej.: Canchas, asado, medallas" data-s="concepto" autocomplete="off" enterkeyhint="next"></div>
  <div class="field"><label class="lbl" for="gm">Monto</label><div class="money"><span>$</span><input id="gm" inputmode="decimal" value="${esc(SH.monto)}" placeholder="0" data-s="monto"></div></div>
  <div class="field"><label class="lbl" for="gp">¿Quién pagó?</label><select id="gp" data-s="pagador">${`<option value="">— Elegir —</option>`+evPeople(e).map(p=>`<option value="${p.id}" ${SH.pagador===p.id?'selected':''}>${esc(pname(p.id))}</option>`).join('')}</select></div>
  <div class="field" id="f-cat"><span class="lbl" id="l-cat">Categoría</span><div class="chips" role="group" aria-labelledby="l-cat">${evCats(e).map(c=>`<button class="chip ${SH.cat===c.id?'on':''}" style="--c:${c.color}" data-a="pickCat" data-id="${c.id}" aria-pressed="${SH.cat===c.id}"><i></i>${esc(c.nombre)}</button>`).join('')}</div></div><div id="f-prop">${propField()}</div>`;
}
function tipPct(){const c=catM(SH.cat);return (SH.gprop&&SH.cat===SH.gcat0)?SH.gprop:(c&&c.prop)||SH.gprop||0;}
function propField(){
  const c=catM(SH.cat),p=tipPct();
  if(!c||!p)return '';
  return `<label class="tipck"><input type="checkbox" id="gtip" data-a="tipTog" ${SH.tip?'checked':''}><span>Sumar propina del ${p}%</span></label>${SH.tip?`<p class="tipt" id="ptot">${tipText()}</p>`:''}`;
}
function tipText(){const m=Math.round((parseMoney(SH.monto)||0)*100),p=tipPct();return m?`Se reparte <b class="num">${fmt(Math.round(m*(100+p)/100))}</b> (${fmt(m)} + ${fmt(Math.round(m*p/100))} de propina)`:`Se suma un ${p}% al monto.`;}
function saveGasto(otro){
  const e=ev(), monto=parseMoney(SH.monto), errs=[];
  if(!SH.concepto.trim()) errs.push('Escribí el concepto.');
  if(!(monto>0)) errs.push('Escribí el monto.');
  if(!SH.pagador) errs.push('Elegí quién pagó.');
  if(!SH.cat) errs.push('Elegí la categoría.');
  if(errs.length){
    document.querySelectorAll('#shb .invalid').forEach(x=>{x.classList.remove('invalid');x.removeAttribute('aria-invalid');});document.querySelectorAll('#shb .field-err').forEach(x=>x.remove());
    const mark=(el,fieldEl,msg,id)=>{if(el){el.classList.add('invalid');el.setAttribute('aria-invalid','true');}const m=document.createElement('p');m.className='field-err';m.id=id;m.textContent=msg;fieldEl.appendChild(m);};
    const F=s=>$(s).closest('.field');let first=null;
    if(!SH.concepto.trim()){mark($('#gc'),F('#gc'),'Escribí qué se pagó.','err-gc');first=first||$('#gc');}
    if(!(monto>0)){mark($('#gm').parentNode,F('#gm'),'Escribí un monto mayor a cero.','err-gm');first=first||$('#gm');}
    if(!SH.pagador){mark($('#gp'),F('#gp'),'Elegí quién lo pagó.','err-gp');first=first||$('#gp');}
    if(!SH.cat){mark(null,$('#f-cat'),'Elegí una categoría.','err-cat');}
    first&&first.focus();return;}
  const id=SH.id; SH_LASTCAT=SH.cat;
  const prop=SH.tip?tipPct():0;
  const g={id:id||'g'+uid(),concepto:SH.concepto.trim(),monto:Math.round(monto*100)/100,pagador:SH.pagador,cat:SH.cat,prop};
  commit(()=>{if(id)e.gastos[e.gastos.findIndex(x=>x.id===id)]=g;else e.gastos.push(g);},id?'Gasto actualizado':'Gasto guardado');
  if(otro)openGasto(null);else close();
}
const readPct=s=>{const el=$(s);return el?Math.min(100,Math.max(0,parseInt(el.value,10)||0)):0;};
function inUse(field,id){return DB.events.some(e=>field==='person'?e.gastos.some(g=>g.pagador===id):e.gastos.some(g=>g.cat===id));}
function nameSheet(title,value,act,id,withColor,color,alias,prop){
  SH={color};
  sheet(title,`<div class="field"><label class="lbl" for="nn">Nombre</label><input id="nn" value="${esc(value)}" autocomplete="off"></div>${alias!==undefined?`<div class="field"><label class="lbl" for="na">Alias para transferencias</label><input id="na" value="${esc(alias)}" placeholder="Ej.: juan.perez.mp" autocomplete="off" autocapitalize="off" spellcheck="false"><p class="hint" style="margin:6px 0 0">Aparece en la liquidación para que le transfieran.</p></div>`:''}${withColor?`<span class="lbl">Color</span><div class="swatches">${COLORS.map(c=>`<button style="--c:${c}" class="${c===color?'on':''}" data-a="pickColor" data-v="${c}" aria-label="Color"></button>`).join('')}</div>`:''}${prop!==undefined?`<div class="field" style="margin-top:14px"><label class="lbl" for="np">Propina sugerida</label><div class="pct"><input id="np" inputmode="numeric" value="${esc(prop)}" maxlength="3"><span>%</span></div><p class="hint" style="margin:6px 0 0">Se suma al cargar un gasto de esta categoría y se puede cambiar en cada gasto. Dejá 0 si no lleva propina.</p></div>`:''}`,`<button class="btn pri grow" data-a="${act}" data-id="${id}">Guardar</button>`);
  setTimeout(()=>$('#nn')&&$('#nn').focus(),60);
}

/* ---------- acciones ---------- */
const A={
  skipSplash:()=>endSplash(),
  home:()=>go('home'), close:()=>close(), back:()=>go(ev()&&STEPS.some(s=>s[0]===BACK)?BACK:'home'),
  step:d=>go(d.v),
  nuevo:()=>{DB.active=null;go('evento');},
  open:d=>{DB.active=d.id;save();go(ev().gastos.length?'liquidacion':'gastos');},
  saveEvent:()=>{
    const t=$('#ft').value.trim();if(!t){$('#ft').focus();{$('#ft').classList.add('invalid');return toast('Poné un título para el evento');}}
    const e=ev();
    if(e){e.titulo=t;save();}
    else{
      const cats=DB.cats.filter(c=>!c.pausado).map(c=>c.id);
      const people=DB.people.filter(p=>!p.pausado||p.club).map(p=>({id:p.id,cats:p.club?[]:cats.slice()}));
      const n={id:'ev'+uid(),titulo:t,orden:Date.now(),cats,people,gastos:[]};DB.events.push(n);DB.active=n.id;save();
    }
    go('gastos');
  },
  delEvent:async()=>{const e=ev();if(!(await ask(`Se borran sus ${e.gastos.length} gastos y la liquidación. No se puede deshacer.`,'Eliminar evento',true,`¿Eliminar “${e.titulo}”?`)))return;DB.events=DB.events.filter(x=>x.id!==e.id);DB.active=null;save();go('home');},
  gasto:d=>openGasto(d.id||null),
  tipTog:()=>{SH.tip=$('#gtip').checked;const fp=$('#f-prop');if(fp)fp.innerHTML=propField();},
  pickCat:d=>{if(SH.cat!==d.id)SH.tip=false;SH.cat=d.id;const fp=$('#f-prop');if(fp)fp.innerHTML=propField();document.querySelectorAll('[data-a="pickCat"]').forEach(b=>{const on=b.dataset.id===d.id;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});const ce=$('#err-cat');ce&&ce.remove();},
  saveGasto:d=>saveGasto(d.v==='otro'),
  delGasto:async()=>{if(!(await ask(`${esc(SH.concepto||'Este gasto')} deja de contar en la liquidación.`,'Eliminar gasto',true,'¿Eliminar este gasto?')))return;const id=SH.id;close();commit(()=>{const e=ev();e.gastos=e.gastos.filter(g=>g.id!==id);},'Gasto eliminado',true);},
  hub:d=>commit(()=>{const e=ev();e.hub=e.hub===d.id?'':d.id;},ev().hub===d.id?'Sin concentrador: cada uno le paga a quien corresponde':pname(d.id)+' concentra los pagos'),
  tog:d=>commit(()=>{const p=ev().people.find(x=>x.id===d.p);p.cats=p.cats.includes(d.c)?p.cats.filter(x=>x!==d.c):p.cats.concat(d.c);}),
  allCat:d=>commit(()=>{const ps=ev().people.filter(p=>!person(p.id)?.club);const all=ps.every(p=>p.cats.includes(d.id));ps.forEach(p=>{p.cats=p.cats.filter(x=>x!==d.id);if(!all)p.cats.push(d.id);});}),
  evPerson:d=>{const e=ev(),n=e.gastos.filter(g=>g.pagador===d.id).length;
    sheet(pname(d.id),n?`<p class="hint">Pagó ${n} gasto(s) en este evento. Para quitarlo, primero cambiá o borrá esos gastos.</p>`:`<p class="hint">Si no vino a este evento, quitalo de la lista. Sigue en tus participantes para los próximos.</p>`,n?'':`<button class="btn red grow" data-a="evRemove" data-id="${d.id}">Quitar de este evento</button>`);},
  evRemove:d=>{close();commit(()=>{const e=ev();e.people=e.people.filter(p=>p.id!==d.id);},pname(d.id)+' quitado del evento',true);},
  sumar:()=>{const e=ev(),out=DB.people.filter(p=>!e.people.some(x=>x.id===p.id));
    sheet('Sumar al evento',out.length?`<div class="list">${out.map(p=>`<button class="row" data-a="evAdd" data-id="${p.id}"><div class="m"><b>${esc(p.nombre)}</b>${p.pausado?'<small>En pausa</small>':''}</div>${ic('plus',20)}</button>`).join('')}</div>`:'<p class="hint">Ya están todos. Para alguien nuevo, usá Menú → Participantes.</p>',`<button class="btn grow" data-a="newFromEvent">${ic('plus',18)} Participante nuevo</button>`);},
  evAdd:d=>{close();commit(()=>{const e=ev();e.people.push({id:d.id,cats:person(d.id).club?[]:e.cats.slice()});},pname(d.id)+' sumado');},
  newFromEvent:()=>{close();go('mpersonas');},
  menu:()=>sheet('Menú',`<div class="menu">
    <button data-a="mgo" data-v="home">${ic('home')} Mis eventos</button>
    <button data-a="sharedOpen">${ic('users')} Compartir con el grupo${SYNC.url?' <span class="sync live" style="margin-left:auto;color:var(--green);background:var(--green-bg)"><i></i>En vivo</span>':''}</button>
    <button data-a="mgo" data-v="mpersonas">${ic('users')} Participantes</button>
    <button data-a="mgo" data-v="mcats">${ic('tag')} Categorías</button>
    <button data-a="exp">${ic('save')} Copiar respaldo</button>
    <button data-a="imp">${ic('copy')} Pegar respaldo</button></div>`),
  mgo:d=>{close();go(d.v);},
  sharedOpen:()=>{
    if(SYNC.url) sheet('Compartir con el grupo',`<div class="ok" style="text-align:left">${SYNC.status==='live'?(SYNC.url==='gas'?'Conectado: todo lo que se carga aparece en pocos segundos en los teléfonos de todos.':'Conectado: todo lo que se carga se ve al instante en los teléfonos de todos.'):'Base configurada. Se sincroniza cuando haya conexión.'}</div>
      <p class="hint" style="margin:0 2px 8px">Pegá este link en el grupo de WhatsApp. Quien lo abra entra directo a los mismos datos.</p>
      <input readonly value="${esc(groupLink())}" id="gl" aria-label="Link para el grupo" style="font-size:14px">
      <p class="hint" style="margin-top:12px">Cualquiera que tenga el link puede ver y modificar los datos. Compartilo solo con el grupo.</p>
      ${SYNC.url==='gas'?'':'<button class="link" data-a="sharedOff" style="color:var(--red)">Dejar de compartir en este teléfono</button>'}`,`<button class="btn grow" data-a="copyLink">${ic('copy',20)} Copiar link</button><a class="btn lime grow" href="https://wa.me/?text=${encodeURIComponent('Entren acá para ver y cargar las cuentas de CCMA: '+groupLink())}" target="_blank" rel="noopener">${ic('chat',20)} Enviar al grupo</a>`);
    else sheet('Compartir con el grupo',`<p class="hint" style="margin-top:0">Para que todos vean y carguen los mismos datos, pegá la dirección de tu base de datos de Firebase (se crea una sola vez, gratis).</p>
      <div class="field"><label class="lbl" for="dbu">Dirección de la base de datos</label><input id="dbu" placeholder="https://ccma-xxxx-default-rtdb.firebaseio.com" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url"></div>
      <p class="hint">Si la base está vacía, se sube lo que ya cargaste en este teléfono.</p>`,`<button class="btn pri grow" data-a="sharedOn">Conectar</button>`);
  },
  sharedOn:async()=>{const u=cleanUrl($('#dbu').value);if(!dbUrlOk(u)){$('#dbu').classList.add('invalid');return toast('Esa dirección no es de Firebase. Copiala tal cual desde Realtime Database.');}const b=document.querySelector('[data-a="sharedOn"]');b.disabled=true;b.textContent='Conectando…';await connectShared(u);close();A.sharedOpen();},
  sharedOff:async()=>{if(!(await ask('Este teléfono deja de ver los datos del grupo. Los datos compartidos no se borran.','Dejar de compartir',true,'¿Dejar de compartir?')))return;disconnectShared();close();render();toast('Este teléfono ya no está conectado al grupo');},
  copyLink:async()=>{try{await navigator.clipboard.writeText(groupLink());toast('Link copiado: pegalo en el grupo');}catch(e){$('#gl').select();toast('Seleccioná el link y copialo');}},
  /* participantes maestros */
  mAddPerson:()=>{const n=$('#mp').value.trim();if(!n)return $('#mp').focus();if(DB.people.some(p=>p.nombre.toLowerCase()===n.toLowerCase()))return toast(n+' ya existe');
    commit(()=>{const p={id:'p'+uid(),nombre:n,pausado:false};DB.people.push(p);const e=ev();if(e)e.people.push({id:p.id,cats:e.cats.slice()});},n+' agregado'+(ev()?' (también al evento abierto)':''));setTimeout(()=>$('#mp')&&$('#mp').focus(),30);},
  mNewPersonOpen:()=>nameSheet('Nuevo participante','','mNewPerson','',false,null,''),
  mNewPerson:()=>{const n=$('#nn').value.trim(),al=$('#na').value.trim();if(!n)return $('#nn').focus();if(DB.people.some(p=>p.nombre.toLowerCase()===n.toLowerCase()))return toast(n+' ya existe');close();
    commit(()=>{const p={id:'p'+uid(),nombre:n,alias:al,pausado:false};DB.people.push(p);const e=ev();if(e)e.people.push({id:p.id,cats:e.cats.slice()});},n+' agregado'+(ev()?' (también al evento abierto)':''));},
  mNewCatOpen:()=>nameSheet('Nueva categoría','','mNewCat','',true,COLORS[DB.cats.length%COLORS.length],undefined,0),
  mNewCat:()=>{const n=$('#nn').value.trim();if(!n)return $('#nn').focus();if(DB.cats.some(c=>c.nombre.toLowerCase()===n.toLowerCase()))return toast(n+' ya existe');const col=SH.color,pr=readPct('#np');close();
    commit(()=>{const c={id:'c'+uid(),nombre:n,color:col,pausado:false,prop:pr};DB.cats.push(c);const e=ev();if(e){e.cats.push(c.id);e.people.forEach(p=>{if(!person(p.id)?.club)p.cats.push(c.id);});}},n+' agregada'+(ev()?' (también al evento abierto)':''));},
  delEventId:async d=>{const e=DB.events.find(x=>x.id===d.id);if(!(await ask(`Se borran sus ${e.gastos.length} gastos y la liquidación.`,'Eliminar evento',true,`¿Eliminar “${e.titulo}”?`)))return;commit(()=>{DB.events=DB.events.filter(x=>x.id!==d.id);if(DB.active===d.id)DB.active=null;},'Evento eliminado',true);},
  mEditPerson:d=>nameSheet('Editar participante',pname(d.id),'mSavePerson',d.id,false,null,person(d.id).alias||''),
  mSavePerson:d=>{const n=$('#nn').value.trim(),al=$('#na').value.trim();if(!n)return;close();commit(()=>{const p=person(d.id);p.nombre=n;p.alias=al;},'Guardado');},
  mPausePerson:d=>commit(()=>{const p=person(d.id);p.pausado=!p.pausado;},person(d.id).pausado?pname(d.id)+' reactivado':pname(d.id)+' en pausa: no se suma a eventos nuevos'),
  mDelPerson:async d=>{if(inUse('person',d.id))return info(`${esc(pname(d.id))} pagó gastos en algún evento, por eso no se puede eliminar. Podés ponerlo en pausa.`);
    if(!(await ask(`Sale de tu lista y de todos los eventos. Si solo deja de venir por un tiempo, mejor ponelo en pausa.`,'Eliminar',true,`¿Eliminar a ${pname(d.id)}?`,'Cancelar')))return;
    commit(()=>{DB.people=DB.people.filter(p=>p.id!==d.id);DB.events.forEach(e=>e.people=e.people.filter(p=>p.id!==d.id));},'Participante eliminado',true);},
  /* categorías maestras */
  mAddCat:()=>{const n=$('#mc').value.trim();if(!n)return $('#mc').focus();if(DB.cats.some(c=>c.nombre.toLowerCase()===n.toLowerCase()))return toast(n+' ya existe');
    commit(()=>{const c={id:'c'+uid(),nombre:n,color:COLORS[DB.cats.length%COLORS.length],pausado:false};DB.cats.push(c);const e=ev();if(e){e.cats.push(c.id);e.people.forEach(p=>{if(!person(p.id)?.club)p.cats.push(c.id);});}},n+' agregada'+(ev()?' (también al evento abierto)':''));},
  mEditCat:d=>{const c=catM(d.id);nameSheet('Editar categoría',c.nombre,'mSaveCat',d.id,true,c.color,undefined,c.prop||0);},
  pickColor:d=>{SH.color=d.v;document.querySelectorAll('[data-a="pickColor"]').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v));},
  mSaveCat:d=>{const n=$('#nn').value.trim();if(!n)return;const col=SH.color,pr=readPct('#np');close();commit(()=>{const c=catM(d.id);c.nombre=n;c.color=col;c.prop=pr;},'Guardado');},
  mPauseCat:d=>commit(()=>{const c=catM(d.id);c.pausado=!c.pausado;},catM(d.id).pausado?'Categoría reactivada':'Categoría en pausa: no se incluye en eventos nuevos'),
  mDelCat:async d=>{if(inUse('cat',d.id))return info(`“${esc(catM(d.id).nombre)}” tiene gastos cargados en algún evento, por eso no se puede eliminar. Podés ponerla en pausa.`);
    if(!(await ask('Sale de tu lista y de los eventos donde no tenía gastos.','Eliminar',true,`¿Eliminar “${catM(d.id).nombre}”?`)))return;
    commit(()=>{DB.cats=DB.cats.filter(c=>c.id!==d.id);DB.events.forEach(e=>{e.cats=e.cats.filter(x=>x!==d.id);e.people.forEach(p=>p.cats=p.cats.filter(x=>x!==d.id));});},'Categoría eliminada',true);},
  detail:d=>{const e=ev(),L=L_(e),r=L.byId[d.id],pag=e.gastos.filter(g=>g.pagador===d.id);
    sheet(pname(d.id),`<div class="sec" style="margin-top:0">Le toca</div>${Object.keys(r.byCat).length?Object.entries(r.byCat).map(([cid,c])=>{const k=L.cats.find(x=>x.id===cid);return `<div class="det"><div>${esc(k.nombre)}<small>${fmt(k.total)} ÷ ${k.ids.length} personas</small></div><b class="num">${fmt(c)}</b></div>`;}).join(''):'<p class="muted">No entra en ninguna categoría.</p>'}
    <div class="sec">Pagó</div>${pag.length?pag.map(g=>`<div class="det"><div>${esc(g.concepto)}</div><b class="num">${fmt(gC(g))}</b></div>`).join(''):'<p class="muted">No pagó gastos.</p>'}
    <div class="list" style="margin-top:16px;padding:6px 14px;background:var(--soft);box-shadow:none"><div class="det"><span>Le toca</span><b class="num">${fmt(r.consumo)}</b></div><div class="det"><span>Pagó</span><b class="num">− ${fmt(r.pago)}</b></div><div class="det"><b>${r.saldo>0?'Tiene que pagar':r.saldo<0?'Tiene que recibir':'Saldado'}</b><b class="num" style="font-size:19px;color:${r.saldo>0?'var(--red)':'var(--green)'}">${fmt(Math.abs(r.saldo))}</b></div></div>`,`<button class="btn pri grow" data-a="close">Listo</button>`);},
  share:()=>{const t=waText();sheet('Compartir',`<textarea class="wa" id="wt" aria-label="Mensaje">${esc(t)}</textarea><p class="hint" style="margin:8px 2px 0">WhatsApp se abre con el mensaje escrito: elegí el grupo y tocá enviar.</p>`,`<button class="btn" data-a="copy" aria-label="Copiar">${ic('copy',20)}</button>${navigator.share?`<button class="btn grow" data-a="shareNative">Compartir…</button>`:''}<a class="btn lime grow" id="wl" data-a="waGo" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">${ic('chat',20)} WhatsApp</a>`);},
  shareNative:async()=>{const t=$('#wt').value;try{await navigator.share({text:t});}catch(e){if(e&&e.name!=='AbortError')A.copy();}},
  waGo:()=>{const t=$('#wt').value;try{navigator.clipboard.writeText(t).then(()=>toast('Texto copiado: si hace falta, pegalo en el chat'),()=>{});}catch(e){}},
  copy:async()=>{const t=$('#wt').value;try{await navigator.clipboard.writeText(t);toast('Copiado');}catch(e){$('#wt').select();try{document.execCommand('copy');toast('Copiado');}catch(x){toast('Seleccioná el texto y copialo');}}},
  exp:async()=>{const t=JSON.stringify(DB);try{await navigator.clipboard.writeText(t);close();toast('Respaldo copiado: pegalo en un chat o nota');}catch(e){sheet('Respaldo',`<textarea class="wa" readonly>${esc(t)}</textarea><p class="hint">Seleccioná todo y copialo.</p>`);}},
  imp:()=>sheet('Pegar respaldo',`<textarea class="wa" id="it" placeholder="Pegá aquí el respaldo"></textarea>`,`<button class="btn pri grow" data-a="impDo">Importar</button>`),
  impDo:async()=>{let d;try{d=JSON.parse($('#it').value);if(!Array.isArray(d.events)||!Array.isArray(d.people)||!Array.isArray(d.cats))throw 0;}catch(e){return toast('El texto no es un respaldo válido');}if(!(await ask('Tus eventos, participantes y categorías actuales se reemplazan por los del respaldo.','Reemplazar datos',true,'¿Importar este respaldo?')))return;DB=d;DB.active=null;save();close();go('home');toast('Respaldo importado');}
};
function waText(){
  const e=ev(),L=L_(e),tr=settle(L,e.hub),o=[];
  o.push(`🎾 *${e.titulo.toUpperCase()}*`,`Total: ${fmt(L.total)}`,'');
  L.cats.filter(c=>c.total).forEach(c=>o.push(`${c.nombre}: ${fmt(c.total)} ÷ ${c.ids.length} = ${fmt(c.ids.length?Math.round(c.total/c.ids.length):0)} c/u`));
  o.push('','*💸 Quién le paga a quién*');if(e.hub&&L.byId[e.hub]&&tr.length)o.push(`⭐ Todos le transfieren a ${pname(e.hub)} y después reparte.`);if(!tr.length)o.push('Nadie le debe nada a nadie ✅');[...new Set(tr.map(t=>t.de))].forEach(src=>{const mine=tr.filter(t=>t.de===src);o.push('',`*${pname(src)}*`+(mine.length>1?` (${mine.length} pagos, total ${fmt(mine.reduce((s,t)=>s+t.c,0))})`:''));mine.forEach(t=>{const al=person(t.para)?.alias;o.push(`• ${fmt(t.c)} → ${pname(t.para)}`+(al?` (alias: ${al})`:''));});});
  return o.join('\n');
}

document.addEventListener('click',x=>{if(x.target.id==='ov'){close();return;}const t=x.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];if(f)f(Object.assign({},t.dataset));});
document.addEventListener('input',x=>{const t=x.target;if(t.dataset.s&&SH){SH[t.dataset.s]=t.value;const inv=t.closest('.invalid')||(t.classList.contains('invalid')?t:null);if(inv){inv.classList.remove('invalid');t.removeAttribute('aria-invalid');const fe=t.closest('.field')?.querySelector('.field-err');fe&&fe.remove();}}if(t.id==='gm'&&$('#ptot'))$('#ptot').innerHTML=tipText();if(t.id==='wt'){const l=$('#wl');if(l)l.href='https://wa.me/?text='+encodeURIComponent(t.value);}});
document.addEventListener('keydown',x=>{if(x.key!=='Enter'&&x.key!=='Escape')return;if(x.key==='Escape'){if($('#ov').classList.contains('open'))close();return;}
  const id=x.target.id;if(id==='ft')A.saveEvent();else if(id==='mp')A.mAddPerson();else if(id==='mc')A.mAddCat();else if(id==='gc'){x.preventDefault();$('#gm').focus();}else if(id==='nn'){const b=document.querySelector('.sh-f [data-a]');b&&b.click();}});

/* bienvenida: animación (~1,3 s) + 1 s de pausa, después pasa sola a la app; un toque la saltea */
function endSplash(){const s=$('#splash');if(!s||s.classList.contains('out'))return;s.classList.add('out');setTimeout(()=>s.remove(),450);}
setTimeout(endSplash,2000);
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.host)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
load();
{const q=new URLSearchParams(location.search).get('db');let saved=null;try{saved=localStorage.getItem(DBKEY);}catch(e){}
 const u=cleanUrl(q||saved||DEFAULT_DB);
 if(q){try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){}}
 if(GAS){SYNC.url='gas';SYNC.status='connecting';connectShared('gas',{silent:true});}
 else if(u&&dbUrlOk(u)){if(q&&q!==saved){DB.active=null;}SYNC.url=u;SYNC.status='connecting';connectShared(u,{silent:!q});}}
{const h=location.hash.slice(1);if(MASTER[h])SCREEN=h;}
render();
</script>
